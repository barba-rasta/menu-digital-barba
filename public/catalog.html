<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Menú Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --theme: #4f46e5; }
    .btn-theme { background-color: var(--theme); }
    .btn-theme:hover { filter: brightness(1.1); }
    .border-theme { border-color: var(--theme); }
    .text-theme { color: var(--theme); }
    .ring-theme:focus { --tw-ring-color: var(--theme); }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans min-h-screen">

  <div id="loading" class="min-h-screen flex items-center justify-center">
    <p class="text-gray-400 text-sm animate-pulse">Cargando catálogo...</p>
  </div>

  <div id="app" class="hidden">
    <!-- Banner -->
    <div id="banner-wrap" class="relative h-44 md:h-56 bg-gradient-to-br from-gray-800 to-gray-900 overflow-hidden">
      <img id="banner-img" src="" alt="" class="hidden w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/40 to-transparent"></div>
    </div>

    <div class="max-w-3xl mx-auto px-4 -mt-16 relative z-10 pb-28">
      <!-- Header negocio -->
      <div class="flex items-end gap-4 mb-6">
        <div id="logo-wrap" class="w-20 h-20 rounded-2xl bg-gray-800 border-4 border-gray-950 shadow-xl flex items-center justify-center overflow-hidden flex-shrink-0">
          <img id="logo-img" src="" alt="" class="hidden w-full h-full object-cover">
          <span id="logo-letter" class="text-2xl font-black text-white">T</span>
        </div>
        <div class="flex-1 pb-1">
          <h1 id="biz-name" class="text-2xl font-black text-white leading-tight"></h1>
          <div class="flex items-center gap-2 mt-1 text-xs text-gray-400">
            <span id="biz-rating" class="text-yellow-400 font-bold"></span>
            <span id="biz-hours"></span>
          </div>
        </div>
      </div>

      <p id="biz-description" class="text-sm text-gray-400 mb-4 leading-relaxed"></p>

      <!-- Redes / mapa -->
      <div id="social-links" class="flex flex-wrap gap-2 mb-6 text-xs font-bold"></div>

      <!-- Buscador -->
      <div class="mb-4">
        <input id="search" type="search" placeholder="Buscar producto..."
          class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 ring-theme">
      </div>

      <!-- Categorías -->
      <div id="categories" class="flex gap-2 overflow-x-auto pb-3 mb-4 scrollbar-hide"></div>

      <!-- Productos -->
      <div id="products" class="space-y-3 mb-10"></div>

      <!-- Reseñas -->
      <section class="border-t border-gray-800 pt-8 space-y-4">
        <h2 class="font-black text-white text-lg">Opiniones</h2>
        <div id="comments-list" class="space-y-3"></div>

        <form id="comment-form" class="bg-gray-900 border border-gray-800 rounded-2xl p-5 space-y-3 text-xs mt-4">
          <p class="font-bold text-gray-300">Deja tu reseña</p>
          <input id="c-author" required type="text" placeholder="Tu nombre" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
          <textarea id="c-text" required rows="2" placeholder="¿Qué te pareció?" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500"></textarea>
          <div class="flex items-center gap-2">
            <label class="text-gray-400">Estrellas:</label>
            <select id="c-rating" class="bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-white">
              <option value="5">5 ★</option>
              <option value="4">4 ★</option>
              <option value="3">3 ★</option>
              <option value="2">2 ★</option>
              <option value="1">1 ★</option>
            </select>
          </div>
          <button type="submit" class="btn-theme w-full py-3 rounded-xl text-white font-extrabold transition">Enviar reseña</button>
        </form>
      </section>
    </div>

    <!-- Carrito flotante WhatsApp -->
    <div id="cart-bar" class="fixed bottom-0 inset-x-0 bg-gray-900/95 border-t border-gray-800 backdrop-blur p-4 z-30 hidden">
      <div class="max-w-3xl mx-auto flex items-center justify-between gap-3">
        <div class="text-xs">
          <span id="cart-count" class="font-bold text-white">0</span>
          <span class="text-gray-400"> productos · </span>
          <span id="cart-total" class="font-bold text-white">$0.00</span>
        </div>
        <button id="btn-whatsapp" class="btn-theme px-5 py-3 rounded-xl text-white text-xs font-extrabold shadow-lg transition">
          Pedir por WhatsApp
        </button>
      </div>
    </div>
  </div>

  <div id="error" class="hidden min-h-screen flex items-center justify-center p-6">
    <div class="text-center space-y-3">
      <p class="text-xl font-black text-white">Negocio no encontrado</p>
      <p class="text-sm text-gray-400">Revisa el enlace o el slug del catálogo.</p>
      <a href="/" class="inline-block text-indigo-400 text-sm font-bold hover:underline">Ir al inicio</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('slug');
    let business = null;
    let allProducts = [];
    let activeCategory = 'Todos';
    const cart = {}; // id -> { product, qty }

    if (!slug) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    } else {
      loadCatalog();
    }

    async function loadCatalog() {
      try {
        const res = await fetch('/api/catalog/' + encodeURIComponent(slug));
        if (!res.ok) throw new Error('not found');
        const data = await res.json();
        business = data.business;
        allProducts = data.products || [];
        render(data);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
      } catch {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.remove('hidden');
      }
    }

    function render(data) {
      const b = data.business;
      const theme = b.themeColor || '#4f46e5';
      document.documentElement.style.setProperty('--theme', theme);
      document.title = b.name + ' - Menú Digital';

      document.getElementById('biz-name').textContent = b.name;
      document.getElementById('biz-description').textContent = b.description || '';
      document.getElementById('biz-hours').textContent = b.businessHours ? '· ' + b.businessHours : '';
      document.getElementById('biz-rating').textContent = '★ ' + (data.avgRating || '5.0') + ' (' + (data.totalReviews || 0) + ')';
      document.getElementById('logo-letter').textContent = (b.name || 'M')[0].toUpperCase();

      if (b.bannerImage) {
        const img = document.getElementById('banner-img');
        img.src = b.bannerImage;
        img.classList.remove('hidden');
      }
      if (b.logoImage) {
        const img = document.getElementById('logo-img');
        img.src = b.logoImage;
        img.classList.remove('hidden');
        document.getElementById('logo-letter').classList.add('hidden');
      }

      // Social
      const social = document.getElementById('social-links');
      const links = [];
      if (b.phone) links.push(`<a href="https://wa.me/${b.phone.replace(/\D/g,'')}" target="_blank" class="px-3 py-1.5 rounded-full bg-green-600/20 text-green-400 border border-green-600/30">WhatsApp</a>`);
      if (b.mapUrl) links.push(`<a href="${esc(b.mapUrl)}" target="_blank" class="px-3 py-1.5 rounded-full bg-blue-600/20 text-blue-400 border border-blue-600/30">Ubicación</a>`);
      if (b.facebookUrl) links.push(`<a href="${esc(b.facebookUrl)}" target="_blank" class="px-3 py-1.5 rounded-full bg-gray-800 text-gray-300 border border-gray-700">Facebook</a>`);
      if (b.instagramUrl) links.push(`<a href="${esc(b.instagramUrl)}" target="_blank" class="px-3 py-1.5 rounded-full bg-gray-800 text-gray-300 border border-gray-700">Instagram</a>`);
      if (b.tiktokUrl) links.push(`<a href="${esc(b.tiktokUrl)}" target="_blank" class="px-3 py-1.5 rounded-full bg-gray-800 text-gray-300 border border-gray-700">TikTok</a>`);
      if (b.address) links.push(`<span class="px-3 py-1.5 rounded-full bg-gray-800 text-gray-400 border border-gray-700">${esc(b.address)}</span>`);
      social.innerHTML = links.join('');

      // Categorías
      const cats = data.categories || ['Todos'];
      document.getElementById('categories').innerHTML = cats.map(c =>
        `<button data-cat="${esc(c)}" class="cat-btn flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition ${c === 'Todos' ? 'btn-theme text-white border-transparent' : 'bg-gray-900 text-gray-300 border-gray-700'}">${esc(c)}</button>`
      ).join('');

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          document.querySelectorAll('.cat-btn').forEach(b => {
            b.className = 'cat-btn flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition bg-gray-900 text-gray-300 border-gray-700';
          });
          btn.className = 'cat-btn flex-shrink-0 px-4 py-2 rounded-full text-xs font-bold border transition btn-theme text-white border-transparent';
          renderProducts();
        });
      });

      renderProducts();
      renderComments(data.comments || []);
    }

    function renderProducts() {
      const q = (document.getElementById('search').value || '').toLowerCase();
      let list = allProducts;
      if (activeCategory !== 'Todos') list = list.filter(p => (p.category || 'General') === activeCategory);
      if (q) list = list.filter(p => (p.name + ' ' + (p.description || '')).toLowerCase().includes(q));

      const el = document.getElementById('products');
      if (!list.length) {
        el.innerHTML = '<p class="text-gray-500 text-sm text-center py-8">No hay productos en esta categoría.</p>';
        return;
      }

      el.innerHTML = list.map(p => {
        const qty = cart[p.id]?.qty || 0;
        return `
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 flex gap-3 items-center">
          ${p.image
            ? `<img src="${esc(p.image)}" class="w-16 h-16 rounded-xl object-cover flex-shrink-0" alt="">`
            : `<div class="w-16 h-16 rounded-xl bg-gray-800 flex-shrink-0"></div>`}
          <div class="flex-1 min-w-0">
            <p class="font-bold text-white text-sm">${esc(p.name)}</p>
            <p class="text-[11px] text-gray-500 line-clamp-2">${esc(p.description || '')}</p>
            <p class="text-sm font-extrabold text-theme mt-1">$${Number(p.price).toFixed(2)}</p>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            ${qty > 0 ? `
              <button onclick="changeQty(${p.id}, -1)" class="w-8 h-8 rounded-lg bg-gray-800 text-white font-bold text-sm">−</button>
              <span class="text-sm font-bold w-5 text-center">${qty}</span>
            ` : ''}
            <button onclick="changeQty(${p.id}, 1)" class="w-8 h-8 rounded-lg btn-theme text-white font-bold text-sm">+</button>
          </div>
        </div>`;
      }).join('');
    }

    function changeQty(id, delta) {
      const p = allProducts.find(x => x.id === id);
      if (!p) return;
      if (!cart[id]) cart[id] = { product: p, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      renderProducts();
      updateCartBar();
    }

    function updateCartBar() {
      const items = Object.values(cart);
      const count = items.reduce((a, i) => a + i.qty, 0);
      const total = items.reduce((a, i) => a + i.qty * Number(i.product.price), 0);
      const bar = document.getElementById('cart-bar');
      if (count === 0) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      document.getElementById('cart-count').textContent = count;
      document.getElementById('cart-total').textContent = '$' + total.toFixed(2);
    }

    document.getElementById('search').addEventListener('input', renderProducts);

    document.getElementById('btn-whatsapp').addEventListener('click', () => {
      if (!business?.phone) {
        alert('Este negocio no tiene WhatsApp configurado.');
        return;
      }
      const items = Object.values(cart);
      let msg = `¡Hola! Quiero pedir de *${business.name}*:%0A%0A`;
      items.forEach(({ product, qty }) => {
        msg += `• ${qty}x ${product.name} ($${(qty * product.price).toFixed(2)})%0A`;
      });
      const total = items.reduce((a, i) => a + i.qty * Number(i.product.price), 0);
      msg += `%0A*Total: $${total.toFixed(2)}*`;
      const phone = business.phone.replace(/\D/g, '');
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    });

    function renderComments(comments) {
      const el = document.getElementById('comments-list');
      if (!comments.length) {
        el.innerHTML = '<p class="text-gray-500 text-sm">Sé el primero en dejar una reseña.</p>';
        return;
      }
      el.innerHTML = comments.map(c => `
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
          <p class="font-bold text-white text-sm">${esc(c.author)} <span class="text-yellow-400 text-xs ml-1">${'★'.repeat(c.rating || 5)}</span></p>
          <p class="text-xs text-gray-400 mt-1">${esc(c.text)}</p>
        </div>
      `).join('');
    }

    document.getElementById('comment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          businessSlug: slug,
          author: document.getElementById('c-author').value.trim(),
          text: document.getElementById('c-text').value.trim(),
          rating: document.getElementById('c-rating').value
        })
      });
      if (res.ok) {
        e.target.reset();
        loadCatalog();
      } else {
        alert('No se pudo enviar la reseña');
      }
    });

    function esc(s) {
      if (!s) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
