<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Menú Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">

  <div class="flex-grow flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl space-y-6 my-8">
      <div class="text-center space-y-2">
        <h1 class="text-2xl font-black text-white">Iniciar Sesión</h1>
        <p class="text-xs text-gray-400">Accede al panel de administración de tu catálogo</p>
      </div>

      <form id="login-form" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-gray-300 mb-1">Correo Electrónico</label>
          <input type="email" id="l-email" required placeholder="tu@email.com" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block font-bold text-gray-300 mb-1">Contraseña</label>
          <input type="password" id="l-password" required placeholder="••••••••" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition text-xs">
          Entrar a mi Panel
        </button>
      </form>

      <p class="text-center text-xs text-gray-400">
        ¿No tienes cuenta aún? <a href="/register.html" class="text-indigo-400 font-bold hover:underline">Regístrate gratis</a>
      </p>
    </div>
  </div>

  <!-- Footer con Firma -->
  <footer class="border-t border-gray-800/80 py-6 text-center text-xs text-gray-500 bg-gray-950/40">
    <div class="max-w-6xl mx-auto px-4 space-y-1">
      <p>© 2026 MenúDigital SaaS. Todos los derechos reservados.</p>
      <p class="text-[11px] text-gray-600 font-mono tracking-wider">
        Desarrollado con ❤️ por <span class="text-indigo-400 font-bold">Jorge Barba</span>
      </p>
    </div>
  </footer>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('l-email').value.trim(),
            password: document.getElementById('l-password').value
          })
        });

        let data = {};
        try { data = await res.json(); } catch (_) {}

        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('slug', data.slug);
          localStorage.setItem('name', data.name);
          window.location.href = '/dashboard.html';
        } else {
          alert(data.error || 'Error al iniciar sesión');
        }
      } catch (err) {
        alert('No se pudo conectar con el servidor. Asegúrate de que esté corriendo en http://localhost:3000');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar a mi Panel';
      }
    });
  </script>
</body>
</html>
